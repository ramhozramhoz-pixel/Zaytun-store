<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaytun Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #e91e63;
    }

    .cart {
      background: #e91e63;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    .hero {
      padding: 35px 20px;
      text-align: center;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 17px;
    }

    .products {
      padding: 25px 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .product-img {
      height: 130px;
      background: #eeeeee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      color: #e91e63;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .add {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 9px;
      background: #e91e63;
      color: white;
      font-size: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #222;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Zaytun Store</div>
  <button class="cart">🛒 Сабад: 0</button>
</header>

<section class="hero">
  <h1>Хуш омадед ба Zaytun Store</h1>
  <p>Мағозаи онлайни шумо</p>
</section>

<section class="products">

  <div class="product">
    <div class="product-img">📱</div>
    <h3>Смартфон</h3>
    <div class="price">2 500 сомонӣ</div>
    <button class="add">Ба сабад</button>
  </div>

  <div class="product">
    <div class="product-img">⌚</div>
    <h3>Соати ҳушманд</h3>
    <div class="price">450 сомонӣ</div>
    <button class="add">Ба сабад</button>
  </div>

  <div class="product">
    <div class="product-img">🎧</div>
    <h3>Гӯшмонак</h3>
    <div class="price">180 сомонӣ</div>
    <button class="add">Ба сабад</button>
  </div>

  <div class="product">
    <div class="product-img">💻</div>
    <h3>Ноутбук</h3>
    <div class="price">5 500 сомонӣ</div>
    <button class="add">Ба сабад</button>
  </div>

</section>

<footer>
  © 2026 Zaytun Store
</footer>
  <script>
let cartCount = 0;

document.querySelectorAll('.add').forEach(button => {
  button.addEventListener('click', () => {
  cartCount++;
document.querySelector('.cart').textContent = '🛒 Сабад: ' + cartCount;
  });
});
</script>
</body>
</html>
